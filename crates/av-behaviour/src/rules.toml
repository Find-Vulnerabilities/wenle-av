# ---------------------------------------------------------------------------
# Registry: bulk operations
# ---------------------------------------------------------------------------

[[rule]]
id = "BEH-0027"
name = "mass registry key delete"
description = "One process deleted thirty registry keys in half a minute."
severity = "medium"
subject = "registry"
action = ["registry_changed"]
detail = ["registry_key_deleted"]
# The application (AppContainer) hive is where Windows' own app-container
# bookkeeping lives and it is created and deleted constantly: measured in the
# test VM on 2026-10-18, `svchost.exe` deleted thirty keys under
# `\REGISTRY\A\{…}\WorkItems\{…}` in half a minute and this rule warned about a
# healthy machine. Excluded rather than raising the count, because the hive's
# volume is not evidence of anything.
#
# The second exclusion is the per-user service instances. Windows creates one
# key per per-user service under `…\ControlSet001\Services\<name>_<hex>` at
# logon and deletes the instance key's subkeys when the session ends. Measured
# in the test VM on 2026-10-19: twenty-four instances carrying twenty-four
# `Security` and six `TriggerInfo` subkeys — exactly thirty deletes, this rule's
# whole threshold, at every boot on a healthy machine. The underscore marks an
# instance name, and the names cannot be listed in advance (Windows adds
# services between versions), so the wildcard form excludes the instance's
# subtree whatever it is called. The plain service key, `P9RdrService`, has no
# underscore and is still covered.
#
# The third is Windows Search's index. When the indexer rebuilds, it deletes
# its scopes' path lists in bulk: measured in the test VM on 2026-10-19,
# `SearchIndexer` deleted thirty keys under
# `\REGISTRY\MACHINE\SOFTWARE\Microsoft\Windows Search\Gather\Windows\SystemIndex\
# Sites\LocalHost\Paths\…` at a session end. The tree exists to be rewritten,
# so its volume says nothing about the process that rewrites it.
#
# The last three are the host measurement of 2026-10-19 between 15:11 and
# 15:41. `svchost` deleted thirty Windows Error Reporting `TermReason` keys,
# the network stack deleted a disconnected interface's `Properties`, and an
# installer deleted thirty `Installer\UserData\…\Components` entries as it
# unregistered itself. All three trees are scratch space the owning component
# rewrites; their volume says nothing about the process rewriting them.
#
# The state repository is the 17:03 and 17:16 measurement of the eight-app
# installation round: installing and removing an AppX package (winget's own
# source, PowerToys' sparse package) made Windows delete thirty entries under
# `…\CurrentVersion\AppModel\StateRepository\Cache\…`, twice. It is the
# database of per-user app state, not configuration anyone is defending.
path_excludes = [
    "\\registry\\a\\",
    "\\registry\\machine\\system\\controlset*\\services\\*_*",
    "\\registry\\machine\\software\\microsoft\\windows search\\",
    "\\windows error reporting\\termreason\\",
    "\\networksetup2\\",
    "\\installer\\userdata\\",
    "\\appmodel\\staterepository\\",
]
# The actor, as in BEH-0003 and BEH-0004. Measured on the host on 2026-10-19,
# 17:03 to 18:16: as each of twenty-two packages was installed or removed,
# `msiexec.exe`, Inno Setup's `unins000.exe`, NSIS's `Un_A.exe` and Squirrel's
# `update.exe` deleted thirty or more keys — COM registrations under
# `HKEY_CLASSES_ROOT`, file associations, the product's own tree — which is
# exactly what the rule is for and exactly what an uninstall is. The remaining
# warnings in the round were all of this shape; a process with none of these
# names deleting thirty keys is still reported.
process_image_excludes = [
    "msiexec.exe", "unins*.exe", "*uninstall*.exe", "un_a.exe", "un_b.exe",
    "un.exe", "_unins", "_iu", "update.exe",
]
count = 30
window_seconds = 30
dedupe_seconds = 300

[[rule]]
id = "BEH-0028"
name = "mass registry key rename"
description = "One process renamed ten registry keys in half a minute."
severity = "low"
subject = "registry"
action = ["registry_changed"]
detail = ["registry_key_renamed"]
# The same exclusion as BEH-0027, for the same measured reason.
path_excludes = ["\\registry\\a\\"]
count = 10
window_seconds = 30
dedupe_seconds = 300

# ---------------------------------------------------------------------------
# Process lineage
# ---------------------------------------------------------------------------

# The shell list shared by the lineage rules. A document reader, a browser or a
# script host starting one of these is a program handing control to a command
# interpreter, which is a macro's or an exploit's next step.
[[rule]]
id = "BEH-0029"
name = "document reader started a shell"
description = "An Office program started a command interpreter."
severity = "high"
score = 90
subject = "process"
action = ["process_started"]
parent_image = [
    "winword.exe", "excel.exe", "powerpnt.exe", "outlook.exe", "msaccess.exe",
    "onenote.exe", "mspub.exe", "visio.exe",
]
path_suffix = [
    "\\cmd.exe", "\\powershell.exe", "\\pwsh.exe", "\\wscript.exe",
    "\\cscript.exe", "\\mshta.exe", "\\certutil.exe", "\\bitsadmin.exe",
    "\\rundll32.exe", "\\regsvr32.exe", "\\msiexec.exe",
]

[[rule]]
id = "BEH-0030"
name = "browser started a shell"
description = "A browser started a command interpreter or a scripting host."
severity = "medium"
subject = "process"
action = ["process_started"]
parent_image = [
    "chrome.exe", "msedge.exe", "firefox.exe", "iexplore.exe", "brave.exe",
    "opera.exe", "vivaldi.exe",
]
path_suffix = [
    "\\cmd.exe", "\\powershell.exe", "\\pwsh.exe", "\\wscript.exe",
    "\\cscript.exe", "\\mshta.exe", "\\certutil.exe", "\\bitsadmin.exe",
    "\\rundll32.exe", "\\regsvr32.exe",
]

[[rule]]
id = "BEH-0031"
name = "script host started a shell"
description = "A script host or an unsigned-library loader started another interpreter."
severity = "medium"
subject = "process"
action = ["process_started"]
parent_image = [
    "wscript.exe", "cscript.exe", "mshta.exe", "rundll32.exe", "regsvr32.exe",
    "msbuild.exe", "installutil.exe", "hh.exe", "wmic.exe",
]
path_suffix = [
    "\\cmd.exe", "\\powershell.exe", "\\pwsh.exe", "\\wscript.exe",
    "\\cscript.exe", "\\mshta.exe", "\\certutil.exe", "\\bitsadmin.exe",
]

[[rule]]
id = "BEH-0032"
name = "shell started a download tool"
description = "A command interpreter started a tool often used to fetch a file."
severity = "low"
subject = "process"
action = ["process_started"]
parent_image = ["cmd.exe", "powershell.exe", "pwsh.exe"]
path_suffix = ["\\certutil.exe", "\\bitsadmin.exe", "\\mshta.exe", "\\wmic.exe", "\\hh.exe"]

[[rule]]
id = "BEH-0033"
name = "process started from a temp folder"
description = "A program was started from a temporary folder."
severity = "low"
subject = "process"
action = ["process_started"]
path_contains = ["\\appdata\\local\\temp\\", "\\windows\\temp\\"]
# The installer harnesses measured on the host on 2026-10-19, 17:06 to 17:15:
# winget's own download directory, Inno Setup's `is-*.tmp` extraction, NSIS's
# `~nsu*.tmp` uninstaller and Squirrel's `SquirrelTemp` all started programs
# from a temporary folder six times in one installation round. Each is a
# harness Windows software distribution uses, so the folder alone is not the
# signal this rule is looking for. A dropper's own directory is not excluded.
#
# The same round's 17:26 to 18:16 half added two more: 7-Zip's self-extractor
# runs the installer from `%TEMP%\7zS*`, and Inno Setup's uninstaller copies
# itself to `%TEMP%\_iu*.tmp` and runs from there. `\temp\ns` is the same NSIS
# prefix without its `~nsu` spelling; `%TEMP%\ns*.tmp` was measured at 17:16.
path_excludes = [
    "\\appdata\\local\\temp\\winget\\", "\\appdata\\local\\temp\\is-",
    "\\appdata\\local\\temp\\~nsu", "\\appdata\\local\\squirreltemp\\",
    "\\temp\\7zs", "\\temp\\_iu",
]

[[rule]]
id = "BEH-0034"
name = "process started from a startup folder"
description = "A program was started from a Startup folder."
severity = "medium"
subject = "process"
action = ["process_started"]
path_contains = ["\\start menu\\programs\\startup\\"]

[[rule]]
id = "BEH-0035"
name = "Office program started a temp-folder program"
description = "An Office program started a program from a temporary folder."
severity = "medium"
subject = "process"
action = ["process_started"]
parent_image = [
    "winword.exe", "excel.exe", "powerpnt.exe", "outlook.exe", "msaccess.exe",
    "onenote.exe", "mspub.exe", "visio.exe",
]
path_contains = ["\\appdata\\local\\temp\\", "\\windows\\temp\\"]

[[rule]]
id = "BEH-0036"
name = "screensaver or control panel program started"
description = "A .scr, .pif or .cpl file was executed from a user profile folder."
severity = "low"
subject = "process"
action = ["process_started"]
path_contains = ["\\appdata\\"]
path_suffix = [".scr", ".pif", ".cpl", ".hta"]

# ---------------------------------------------------------------------------
# Detection evasion: the keys that point the protection somewhere else
#
# Every rule above watches what a program *does*. These watch the smaller set of
# keys that decide whether anything is watching at all, or which component runs
# in the place of the one that should. They are narrow by construction rather
# than by exclusion: each of these keys is written by the component that owns it
# and by nothing else, so "this key changed" is already a specific statement,
# and a whitelist would only be a list of the installers that legitimately write
# them.
#
# The directories below are the same "an unprivileged user can write here" list
# BEH-0010 established -- a component installed properly lives in
# `Program Files`; one that lives in a profile was put there by something that
# could not write to `Program Files`.
# ---------------------------------------------------------------------------

[[rule]]
id = "BEH-0040"
name = "Defender exclusion added"
description = "An exclusion was added to Windows Defender's scan list."
severity = "high"
score = 70
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
# The exclusions live outside the `Policies` tree BEH-0021 watches: that one is
# the GPO switch that turns a feature off, this one is the list of places to
# stop looking. `\exclusions\paths` and `\exclusions\extensions` are the two an
# attack reaches for; `\exclusions\processes` is the third and is included with
# them because a process exclusion is the strongest of the three.
path_contains = [
    "\\microsoft\\windows defender\\exclusions\\",
]
# Legitimate writers exist and are not silent: an enterprise deployment policy
# adds exclusions, and some security products add one for their own install
# directory. That is why this is evidence worth 70 and not a refusal -- it takes
# a second rule to reach the malicious threshold.

[[rule]]
id = "BEH-0041"
name = "AMSI provider registered"
description = "A DLL was registered as an AMSI provider."
severity = "high"
score = 70
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
# AMSI is the interface every script host on Windows asks before it runs
# something. Registering a provider is how an antivirus hooks it -- and how
# something that wants to answer "clean" on its own behalf does the same thing.
# Both write this key and only they do, so the key is the whole condition.
#
# This product's own `wenle integrate amsi install` writes it too. That is a
# warning on an install the user typed, which is noise the product should own
# rather than hide: excluding the image name would exclude a copy of the
# installer renamed to that name.
path_contains = [
    "\\microsoft\\amsi\\providers\\",
]

[[rule]]
id = "BEH-0042"
name = "COM server points into a writable folder"
description = "A COM class was pointed at a DLL in a directory an unprivileged user can write to."
severity = "high"
score = 75
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
# COM hijacking: the class keeps its name, so every program that asks for it
# loads whatever the key now points at. The discriminator is the directory the
# value points into -- a COM server in `Program Files` is every registered
# component on the machine, and one in a profile is not. `InprocServer32` is the
# key a DLL-backed class uses, so the key itself already says "this is a DLL";
# requiring a `.dll` in the value would only add a way to miss a quoted path.
path_contains = ["\\inprocserver32"]
value_contains = [
    "\\appdata\\", "%appdata%", "%localappdata%",
    "%temp%", "%tmp%", "\\temp\\",
    "%userprofile%", "\\users\\public\\",
    "\\programdata\\", "\\downloads\\", "\\desktop\\", "\\documents\\",
]
# Per-user installers register their classes under HKCU and put the DLL in
# `%LOCALAPPDATA%\Programs\<product>` -- the same measurement BEH-0003 records
# from the winget round of 2026-10-19. That tree is where per-user software is
# installed, which is not where a hijack hides. The exclusion is against the
# *value*, not the key, for the same reason the positive condition is: the key
# is `InprocServer32` in both cases.
value_excludes = ["\\appdata\\local\\programs\\"]

[[rule]]
id = "BEH-0043"
name = "AppCertDlls written"
description = "A DLL was added to the list every process loads when it calls the certificate APIs."
severity = "high"
score = 85
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
# `AppCertDlls` is loaded into every process that calls into the Win32
# certificate verification APIs -- it is a documented injection point and has no
# ordinary caller: no installer adds one, no driver needs one, and the list is
# empty on a healthy machine. A write here is the behaviour, so there is no
# value condition to narrow.
path_contains = ["\\control\\session manager\\appcertdlls"]

[[rule]]
id = "BEH-0044"
name = "boot execute program added"
description = "A program was added to the list the session manager runs before anything else starts."
severity = "high"
score = 85
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
# `BootExecute` runs in the native session before any driver-dependent
# subsystem exists, which is why it is attractive and why almost nothing writes
# it. The one ordinary writer is `chkdsk`, which schedules a check by writing
# `autocheck autochk ...`, so that string is the exclusion rather than a
# process name. Its limit is worth stating: a value that carries both a check
# and a program passes, because the exclusion is a substring and the positive
# condition is the key.
path_contains = ["\\control\\session manager\\bootexecute"]
value_excludes = ["autocheck autochk"]

[[rule]]
id = "BEH-0045"
name = "Run key written under the Explorer policy path"
description = "A program was listed to start at sign-in from the policy branch of the Run key."
severity = "high"
score = 80
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
# The same idea as BEH-0010 at the other address: BEH-0010 matches
# `\currentversion\run\`, and this one matches the `Policies` branch a policy
# would write. No installer uses this branch, which makes it the more specific
# of the two even before the value is looked at.
path_contains = ["\\currentversion\\policies\\explorer\\run\\"]
value_contains = [
    "\\appdata\\", "%appdata%", "%localappdata%",
    "%temp%", "%tmp%", "\\temp\\",
    "%userprofile%", "\\users\\public\\",
    "\\programdata\\", "\\downloads\\", "\\desktop\\", "\\documents\\",
]

[[rule]]
id = "BEH-0046"
name = "service DLL in a writable folder"
description = "A service was pointed at a DLL in a directory an unprivileged user can write to."
severity = "high"
score = 75
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
# The sibling of BEH-0015, which watches `ImagePath`. A service that names a
# host executable (`svchost.exe -k ...`) loads its own code through `ServiceDll`
# instead, so a service pointing its `ImagePath` at `System32` can still load a
# DLL from a profile folder -- and that is the half BEH-0015 cannot see.
path_contains = ["\\services\\"]
path_suffix = ["\\servicedll"]
value_contains = [
    "\\appdata\\", "%appdata%", "%localappdata%",
    "%temp%", "%tmp%", "\\temp\\",
    "%userprofile%", "\\users\\public\\",
    "\\programdata\\", "\\downloads\\", "\\desktop\\", "\\documents\\",
]

[[rule]]
id = "BEH-0047"
name = "program started from a network share"
description = "A program was started from a network share rather than from a local disk."
severity = "high"
score = 70
subject = "process"
action = ["process_started"]
# A `\\server\share` binary is not installed on this machine, is not in any
# local backup, and is not there the next time it runs -- which is why loaders
# and lateral movement use one. Ordinary use of a share is rare enough that the
# path shape alone is specific.
path_prefix = ["\\\\"]

[[rule]]
id = "BEH-0048"
name = "service host started an interpreter"
description = "A service host process started a command interpreter or a script host."
severity = "high"
score = 75
subject = "process"
action = ["process_started"]
# `svchost.exe` starts services, not command lines. The child is matched by its
# trailing name rather than by a directory, because where the interpreter lives
# is not what makes this specific -- who started it is.
parent_image = ["svchost.exe", "services.exe", "lsass.exe", "wininit.exe"]
path_suffix = [
    "\\powershell.exe", "\\pwsh.exe", "\\cmd.exe", "\\mshta.exe",
    "\\wscript.exe", "\\cscript.exe", "\\rundll32.exe", "\\regsvr32.exe",
    "\\bitsadmin.exe", "\\certutil.exe",
]

[[rule]]
id = "BEH-0049"
name = "document or browser started a DLL host"
description = "A document reader or a browser started rundll32 or regsvr32."
severity = "high"
score = 75
subject = "process"
action = ["process_started"]
# Both of these load a DLL named on their command line, which makes them the
# usual second stage for a document that decided to run something: the reader
# stays the parent and the loader is a signed Microsoft binary in `System32`.
# The pair is the condition; neither half is interesting on its own, which is
# what keeps it quiet on a healthy machine.
parent_image = [
    "winword.exe", "excel.exe", "powerpnt.exe", "outlook.exe", "msaccess.exe",
    "onenote.exe", "mspub.exe", "visio.exe",
    "chrome.exe", "msedge.exe", "firefox.exe", "iexplore.exe", "acrord32.exe",
]
path_suffix = ["\\rundll32.exe", "\\regsvr32.exe"]

[[rule]]
id = "BEH-0050"
name = "Defender real-time protection key written"
description = "The registry key that switches Windows Defender's real-time protection was written."
severity = "medium"
score = 55
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
# The switch itself is a `REG_DWORD`, which this driver does not render as text,
# so the rule cannot read what it was set to. It says the key was written and
# claims nothing about the direction. The key is only written when something
# toggles the setting: the user in the Security app, a policy, or whatever wants
# the scanner off.
path_contains = ["\\microsoft\\windows defender\\real-time protection\\"]

[[rule]]
id = "BEH-0051"
name = "LSA notification package registered"
description = "A package was added to the list the local security authority loads into every logon."
severity = "high"
score = 85
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
# The sibling of BEH-0026, which watches `security packages`. A notification
# package is loaded into `lsass.exe` itself and is handed the credentials of
# every logon, which is why almost nothing legitimate registers one -- the list
# is empty on a healthy machine.
path_contains = ["\\control\\lsa\\notification packages"]

[[rule]]
id = "BEH-0052"
name = "logon script set for this user"
description = "A logon script was set in the user's environment key."
severity = "high"
score = 80
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
# `UserInitMprLogonScript` runs when the user's session is created, and it is
# the one Run-like mechanism that survives policy changes to the Run keys. Group
# Policy does not set it and no installer uses it; it is set by hand.
path_contains = ["\\environment\\userinitmprlogonscript"]

# ---------------------------------------------------------------------------
# The ransomware chain, at the rungs that are visible
#
# What this stream can see is file-system operations. A bootkit writing sector
# zero of a disk opens `\\.\PhysicalDrive0` and writes; no file system is
# involved, so no callback of a minifilter sees it, and a rule for it would
# never fire. What *is* a file is the boot chain on the EFI system partition --
# `bootmgfw.efi` and the BCD store -- and that is the half of the same attack
# this product can observe. Detection there is still after the fact; it is
# reported because knowing which process rewrote the loader is worth something,
# not because it is prevention.
# ---------------------------------------------------------------------------

[[rule]]
id = "BEH-0053"
name = "ransom note written"
description = "A file with a ransom note's name was written."
severity = "high"
score = 90
subject = "file"
action = ["file_written"]
# BEH-0002 catches the note when it arrives by rename, which is how most
# families drop it beside the encrypted files. This is the other way it arrives:
# written directly. Both are the same sentence to a user and neither is a
# rename, so they cannot share a rule.
path_contains = [
    "how_to_decrypt", "how to decrypt", "how_to_restore", "decrypt_instructions",
    "decryption_instructions", "readme_for_decrypt", "your_files_are_encrypted",
    "restore_your_files", "recover_your_files", "help_decrypt", "!!!readme",
]
dedupe_seconds = 300

[[rule]]
id = "BEH-0054"
name = "documents written in bulk"
description = "One process wrote forty files inside document folders within half a minute."
severity = "medium"
score = 60
subject = "file"
action = ["file_written"]
# Encryption in place leaves no rename and no delete: the file keeps its name
# and its directory and its bytes change, which on this stream is a write and
# nothing else. So the sweep that BEH-0003 and BEH-0005 catch by name has a
# third shape, and this is it.
#
# The trees are the ones a user's work lives in. Everything below them is where
# software churns by design and is excluded for the reason BEH-0003 records:
# caches, package directories and build output all write dozens of files in
# seconds on a healthy machine.
path_contains = [
    "\\documents\\", "\\desktop\\", "\\downloads\\",
    "\\pictures\\", "\\videos\\", "\\music\\", "\\onedrive\\",
]
path_excludes = [
    "\\appdata\\", "\\windows\\", "\\program files", "\\programdata\\",
    "\\$recycle.bin\\", "\\node_modules\\", "\\.git\\", "\\target\\debug\\",
    "\\target\\release\\", "\\.venv\\", "\\site-packages\\",
]
count = 40
window_seconds = 30
dedupe_seconds = 300

[[rule]]
id = "BEH-0055"
name = "recovery removal tool started"
description = "A tool that deletes shadow copies or backup catalogues was started."
severity = "high"
score = 60
subject = "process"
action = ["process_started"]
# The rung before the encryption: a family that intends to make restoration
# impossible runs one of these first. The command line is not in this event
# stream, so the rule reports the tool and not its arguments, and the score
# reflects a tool that an administrator can also legitimately reach for.
path_suffix = ["\\vssadmin.exe", "\\wbadmin.exe", "\\diskshadow.exe"]

[[rule]]
id = "BEH-0056"
name = "boot loader or boot configuration modified"
description = "A file in the boot chain was written or renamed by something other than servicing."
severity = "high"
score = 70
subject = "file"
action = ["file_written", "file_renamed"]
# The visible half of the bootkit question. A raw write to the disk's partition
# table never reaches a file-system filter, but the loader and the BCD store are
# files, and replacing them is how a bootkit gets loaded next time without
# touching a single sector itself.
path_contains = ["\\efi\\microsoft\\boot\\", "\\efi\\boot\\", "\\boot\\bcd"]
path_suffix = [".efi", "\\bcd"]
# Windows servicing rewrites these on every feature update.
process_image_excludes = [
    "tiworker.exe", "trustedinstaller.exe", "dism.exe", "setup.exe",
    "windowsupdatebox.exe", "bcdedit.exe", "wusa.exe",
]

# ---------------------------------------------------------------------------
# Pairs and places
#
# The rules below are pairs -- this parent starting this child, here -- because
# a pair is the most specific condition this event stream can express: neither
# half is interesting, and the combination has almost no ordinary writer.
# ---------------------------------------------------------------------------

[[rule]]
id = "BEH-0057"
name = "browser started a downloaded program"
description = "A browser started a program from the folder it saves downloads into."
severity = "high"
score = 80
subject = "process"
action = ["process_started"]
# A browser that has to run something downloads an installer and the user runs
# it from Explorer, so the browser is not the parent. When it *is* the parent,
# the download was executed by whatever drove the browser -- which is the
# "click here to update your Flash" shape. The start folder is matched rather
# than the file name, because the name is the attacker's to choose.
parent_image = [
    "chrome.exe", "msedge.exe", "firefox.exe", "iexplore.exe", "brave.exe",
    "opera.exe", "vivaldi.exe", "thorium.exe",
]
path_contains = ["\\downloads\\", "\\appdata\\local\\temp\\", "\\windows\\temp\\"]

[[rule]]
id = "BEH-0058"
name = "program started from the recycle bin"
description = "A program was executed out of the Recycle Bin."
severity = "high"
score = 85
subject = "process"
action = ["process_started"]
# Nothing legitimate starts from `$Recycle.Bin`: a deleted program that runs is
# either being resurrected or was never meant to look like a program. There is
# no caveat worth writing, which is why this is one condition.
path_contains = ["\\$recycle.bin\\"]

# Sideloading is deliberately absent: `ImageLoaded` events in this build carry
# the process and no path (`dsl.rs`, `Subject::from_driver`), so "a DLL loaded
# out of %TEMP%" is not expressible until the driver sends the image's path.

[[rule]]
id = "BEH-0060"
name = "COM local server points into a writable folder"
description = "A COM class was pointed at an executable in a directory an unprivileged user can write to."
severity = "high"
score = 75
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
# The sibling of BEH-0042, for the classes that run out of process. Same reason,
# same discriminator: the key is fixed and the value's directory is the fact.
path_contains = ["\\localserver32"]
value_contains = [
    "\\appdata\\", "%appdata%", "%localappdata%",
    "%temp%", "%tmp%", "\\temp\\",
    "%userprofile%", "\\users\\public\\",
    "\\programdata\\", "\\downloads\\", "\\desktop\\", "\\documents\\",
]
value_excludes = ["\\appdata\\local\\programs\\"]

[[rule]]
id = "BEH-0061"
name = "executable written into a startup folder"
description = "A program or a shortcut was written into a Startup folder."
severity = "high"
score = 75
subject = "file"
action = ["file_written"]
# BEH-0007 catches an executable that arrives by rename. Dropping one is a
# write, and it is the commoner way: the file is created there rather than moved
# there. Same folders, same suffixes, different action -- which is why neither
# rule can cover both.
path_contains = ["\\start menu\\programs\\startup\\"]
path_suffix = [
    ".lnk", ".exe", ".dll", ".bat", ".cmd", ".vbs", ".vbe", ".js", ".jse",
    ".wsf", ".hta", ".ps1", ".scr",
]

[[rule]]
id = "BEH-0062"
name = "print processor or port monitor driver written"
description = "A print processor or port monitor was pointed at a DLL."
severity = "high"
score = 80
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
# A print processor and a port monitor are both loaded by the spooler into every
# process that prints, which makes them a persistence surface that needs no
# service of its own and no scheduled task. Their `Driver` value is the DLL, and
# the only ordinary writer is a printer driver's installer.
path_contains = [
    "\\control\\print\\environments\\", "\\control\\print\\monitors\\",
]
path_suffix = ["\\driver"]

[[rule]]
id = "BEH-0063"
name = "icon service DLL written"
description = "The DLL every program with a window loads at start-up was changed."
severity = "high"
score = 80
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
# `IconServiceLib` is the sibling of `AppInit_DLLs` that BEH-0016 watches: a DLL
# named there is loaded into processes that draw an icon, and nothing but a
# deliberate change writes it. It is a separate rule because it is a different
# key -- a rule for one would never match the other.
path_contains = ["\\currentversion\\windows\\iconservicelib"]

[[rule]]
id = "BEH-0064"
name = "program started from the public profile"
description = "A program was started from the shared Public profile."
severity = "medium"
score = 55
subject = "process"
action = ["process_started"]
# `C:\Users\Public` is writable by every account and is not where anything is
# installed, which is why it shows up as a staging directory. Installers use it
# too -- some redistributables unpack there -- so this is a warning, and the
# pair rules above are what turn it into a finding.
path_contains = ["\\users\\public\\"]

[[rule]]
id = "BEH-0065"
name = "shadow copy exclusion added"
description = "A path was excluded from volume shadow copies."
severity = "high"
score = 75
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
# `FilesNotToSnapshot` decides what a shadow copy leaves out, and adding an
# entry is how a family makes sure the encrypted files are not recoverable from
# a previous version. Backup software writes here too, which is what the score
# says: evidence, not a verdict.
path_contains = ["\\control\\backuprestore\\filesnottosnapshot"]

# ---------------------------------------------------------------------------
# Command lines
#
# A rule here is a program **and** what it was asked to do. That is the pair the
# command line unlocks: `vssadmin.exe` listing shadow copies and
# `vssadmin.exe delete shadows /all` were the same event until the service
# started reading the command line off the started process. The condition is
# written as substrings of the folded command line, so `delete` and `shadows` in
# either order -- and in either case -- satisfy it, while a `vssadmin list`
# does not.
# ---------------------------------------------------------------------------

[[rule]]
id = "BEH-0066"
name = "shadow copies deleted"
description = "vssadmin was asked to delete shadow copies."
severity = "high"
score = 85
subject = "process"
action = ["process_started"]
# The rung that makes everything after it unrecoverable. `vssadmin list
# shadows` is an administrator looking; `vssadmin delete shadows` is the
# preparation for encryption, and the two are told apart only by these two
# words.
path_suffix = ["\\vssadmin.exe"]
command_line_requires = ["delete", "shadows"]

[[rule]]
id = "BEH-0067"
name = "recovery disabled through the boot configuration"
description = "bcdedit was asked to disable recovery."
severity = "high"
score = 85
subject = "process"
action = ["process_started"]
# `bcdedit /set {default} recoveryenabled No` -- written as the two words with
# the space between them, because that is the form the syntax produces. A bare
# `no` would match most command lines on a machine.
path_suffix = ["\\bcdedit.exe"]
command_line_contains = ["recoveryenabled no"]

[[rule]]
id = "BEH-0068"
name = "certutil used to download"
description = "certutil was asked to fetch a URL into the cache."
severity = "high"
score = 80
subject = "process"
action = ["process_started"]
# `certutil -urlcache -f http://...` is a download with a signed Microsoft
# binary, which is why it is used. `-urlcache` alone is also how a cache is
# cleared, so the pair carries the condition.
path_suffix = ["\\certutil.exe"]
command_line_requires = ["-urlcache", "http"]

[[rule]]
id = "BEH-0069"
name = "powershell with an encoded command"
description = "powershell was started with a base64-encoded command."
severity = "high"
score = 80
subject = "process"
action = ["process_started"]
# `-encodedcommand` is the long form and is unambiguous. `-enc` is the
# abbreviation every loader uses and also the prefix of `-encodedcommand`
# itself, so the two together cover both spellings without matching an
# ordinary argument.
path_suffix = ["\\powershell.exe", "\\pwsh.exe"]
command_line_contains = ["-encodedcommand", "-enc "]

[[rule]]
id = "BEH-0070"
name = "mshta started on a URL"
description = "mshta was started on a web address or an inline script."
severity = "high"
score = 80
subject = "process"
action = ["process_started"]
# `mshta http://...` runs whatever the page returns without writing a file
# first, and `mshta javascript:` does the same inline. Both are the same
# sentence: an HTML host was handed something to execute.
path_suffix = ["\\mshta.exe"]
command_line_contains = ["http", "javascript:", "vbscript:"]
