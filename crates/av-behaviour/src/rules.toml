# Wenle AV behaviour rules.
#
# These are evaluated over the driver's event stream, not over file bytes:
# `subject` and `action` say which stream, `path_*` and `detail` narrow the
# event, and `count`/`window_seconds` say how many are needed and how close
# together. See `crates/av-behaviour/src/dsl.rs` for the language and
# `crates/av-behaviour/src/lib.rs` for why it is not YARA.
#
# Every rule here is in the warning band: its score is below the malicious
# threshold (100), so no rule can quarantine, delete or block anything on its
# own. A finding is evidence that adds to a score. `severity` says how damaging
# the behaviour would be if genuine; `score` says how much this evidence is
# worth. They are different questions, which is why a few rules are `high`
# severity with a score under 100.
#
# `dedupe_seconds` (default: the window) is how long a rule stays quiet for one
# process after firing, so a sweep produces one warning rather than twenty
# thousand.

# ---------------------------------------------------------------------------
# Ransomware: the file stream
# ---------------------------------------------------------------------------

[[rule]]
id = "BEH-0001"
name = "ransomware extension"
description = "A file was renamed with the extension ransomware leaves behind."
severity = "high"
score = 90
subject = "file"
action = ["file_renamed"]
path_suffix = [
    ".locked", ".encrypted", ".encrypted1", ".crypt", ".crypted", ".wncry",
    ".wcry", ".locky", ".zepto", ".cerber", ".ryk", ".petya", ".conti",
    ".rhysida", ".blackcat", ".akira", ".makop", ".phobos", ".djvu", ".sage",
]
# Measured on the host on 2026-10-19 at 15:57 and again at 16:00: Steam's
# updater renamed `C:\Program Files (x86)\Steam\libx264-142.dll` to
# `libx264-142.dll.crypt` — the name Steam ships its DRM-encrypted decoder
# under, with the matching `.md5` beside it since 2026-07-02. One file, so one
# path, and not the whole Steam install: a `.crypt` file anywhere else still
# fires.
path_excludes = ["\\steam\\libx264-142.dll.crypt"]
dedupe_seconds = 300

[[rule]]
id = "BEH-0002"
name = "ransom note name"
description = "A file with a ransom note's name appeared."
severity = "high"
score = 90
subject = "file"
action = ["file_renamed"]
path_contains = [
    "how_to_decrypt", "how to decrypt", "how_to_restore", "decrypt_instructions",
    "decryption_instructions", "readme_for_decrypt", "your_files_are_encrypted",
    "restore_your_files", "recover_your_files", "help_decrypt", "!!!readme",
]
dedupe_seconds = 300

[[rule]]
id = "BEH-0003"
name = "mass file rename"
description = "One process renamed twenty files in half a minute, which is the shape of a sweep."
severity = "medium"
subject = "file"
action = ["file_renamed"]
# Trees where a healthy machine renames files in bulk, measured on the host on
# 2026-10-19 while the driver was loaded: every entry below produced a warning
# about a machine with nothing wrong with it.
#
#   …\AppData\Local\Comms\Unistore\…     UnistoreSvc's own rewrite
#   …\Windows\AppCompat\Programs\…       the compatibility inventory
#   …\Windows\Prefetch\…                 prefetch rotation
#   …\Windows\System32\SRU\…             the resource-usage log window
#   …\System32\config\systemprofile\…    the service account's cache
#   …\EBWebView\…                        an application's embedded browser cache
#   …\Code Cache\…, …\GrShaderCache\…    the browsers' caches
#   …\CacheStorage\…, …\CryptnetUrlCache\, …\DataReporting\
#   …\User Data\System Profile\…         Chrome's rewrite of `Secure Preferences`
#   …\discount_infos_db\…                the browsers' price-tracking database
#   …\AppData\Roaming\Surfshark\…        a VPN's log rotation
#   …\AppData\Roaming\.minecraft\…       the launcher's staging cache
#   …\AppData\LocalLow\SogouPY\…         an input method's data
#   …\Program Files (x86)\Steam\…        a platform update's own files
#   …\AppData\Local\Steam\…              the platform's embedded-browser cache
#   …\AppData\Local\Programs\…           a per-user installer's own files
#
# The last line is the measurement of 2026-10-19 17:08: Inno Setup, installed
# per-user by winget, renamed its language files in bulk while it unpacked
# itself into `%LOCALAPPDATA%\Programs\Inno Setup 6`. Every per-user installer
# writes and renames its files there — Obsidian does the same at 17:15 when it
# removes itself — so the tree is excluded, while `C:\Program Files` stays
# reported except for Steam.
#
# These are trees, not processes: the same sweep in a user's documents, on the
# Desktop, in Downloads or in %TEMP% still fires. The development toolchain's
# own trees (`target\debug`, `target\release`, `.claude\plugins\cache`) are
# deliberately absent — they were measured, but they say "this machine builds
# software", not "Windows churns here".
path_excludes = [
    "\\appdata\\local\\comms\\", "\\windows\\appcompat\\programs\\",
    "\\windows\\prefetch\\", "\\windows\\system32\\sru\\",
    "\\windows\\system32\\config\\systemprofile\\appdata\\local\\",
    "\\ebwebview\\", "\\code cache\\", "\\grshadercache\\",
    "\\cachestorage\\", "\\cryptneturlcache\\", "\\datareporting\\",
    "\\user data\\system profile\\", "\\discount_infos_db\\",
    "\\appdata\\roaming\\surfshark\\", "\\appdata\\roaming\\.minecraft\\",
    "\\appdata\\locallow\\sogoupy\\", "\\.cc-switch\\", "\\com.ccswitch.desktop\\",
    "\\program files (x86)\\steam\\", "\\appdata\\local\\steam\\",
    "\\appdata\\local\\programs\\", "\\fontcache\\",
    "\\windows\\appcompat\\aidd\\", "\\temp\\ns", "\\temp\\7zs",
]
# The font cache, the application-impact store, and the two installer
# unpackers are the 17:26 to 18:16 measurement of the same day: the font cache
# rotated `FontCache-Obsolete-*.dat`, the compatibility store rewrote
# `aidd_*.txt`, and NSIS and 7-Zip unpacked their own files into `%TEMP%`
# while installing and removing software.
#
# The actor, not the tree. An uninstaller removing the product it was installed
# to remove renames that product's files in bulk, and the path cannot say so:
# `C:\Program Files\Audacity\…` is the same path whether the user is removing
# Audacity or something is sweeping it. Measured on the host on 2026-10-19 from
# 17:03 to 18:16 over twenty-two install and uninstall pairs driven through
# winget: Windows Installer's `msiexec.exe` (Audacity, Zoom, LibreOffice,
# Thunderbird), Inno Setup's `unins000.exe` and `_iu_*.tmp`, NSIS's `Un_A.exe`
# and `Un_B.exe`, and Squirrel's `update.exe` (Slack, and Discord when it
# updates) each did exactly this. Each produces one warning per removal
# otherwise, and every one is a program being removed by its own uninstaller.
#
# The list is of names, not of trust: a process named `unins000.exe` that
# sweeps a user's documents is still reported, because these entries refuse
# only this mass-file rule, and BEH-0005's document roots do not include any
# program tree.
process_image_excludes = [
    "msiexec.exe", "unins*.exe", "*uninstall*.exe", "un_a.exe", "un_b.exe",
    "un.exe", "_unins", "_iu", "update.exe",
]
count = 20
window_seconds = 30
dedupe_seconds = 600

[[rule]]
id = "BEH-0004"
name = "mass file delete"
description = "One process requested the deletion of twenty-five files in half a minute."
severity = "medium"
subject = "file"
action = ["file_deleted"]
# Defender's scan history store. Measured on 2026-10-19 at 13:56:00 while the
# behaviour fixture was being run in the test VM: Defender's own maintenance
# deleted twenty-five files under
# `C:\ProgramData\Microsoft\Windows Defender\Scans\History\Store\…` in half a
# minute, and the rule warned about a healthy machine a minute after the
# fixture had finished. The store is rotated and pruned by design, so its
# volume says nothing about the process pruning it. The exclusion is the
# measured subtree, not all of Defender: a program deleting its definitions or
# its program files is still reported.
#
# The rest are the host measurement of 2026-10-19, 14:41 to 15:42, with the
# driver loaded. Each line is a site where a healthy machine deleted
# twenty-five files in half a minute:
#
#   …\AppData\Local\Comms\Volatile\POOM\…   UnistoreSvc's own rewrite
#   C:\$Extend\$Deleted\…                    the NTFS delete queue, not files
#   …\Windows\AppCompat\Programs\…           the compatibility inventory
#   …\Windows\Prefetch\…                     prefetch rotation
#   …\Windows\System32\SRU\…                 the resource-usage log window
#   …\System32\config\systemprofile\…        the service account's cache
#   …\D3DSCache\…                            the shader cache
#   …\EBWebView\…, …\Code Cache\…            browser and WebView2 caches
#   …\GrShaderCache\…, …\CacheStorage\…
#   …\CryptnetUrlCache\, …\OneDrive\logs\…   caches and log rotation
#   …\AppData\Roaming\Surfshark\…            a VPN's log rotation
#   …\AppData\Roaming\.minecraft\…           the launcher's staging cache
#   …\AppData\LocalLow\SogouPY\…             an input method's data
#   …\Mozilla\Firefox\Profiles\…\cache2\…    Firefox's cache rotation
#   …\Program Files (x86)\Steam\…            a platform update deleting `.old`
#   …\AppData\Local\Steam\htmlcache\…        its embedded-browser cache
#   …\Program Files\WindowsApps\Deleted\…   a package update removing the old copy
#   …\ProgramData\Microsoft\Windows\AppRepository\Packages\…
#                                            the package repository's own record
#   C:\Config.Msi\…                          an MSI's rollback file
#   …\AppData\Local\Programs\…               a per-user installer's own files
#   …\AppData\Local\PowerToys\…              a program removing itself
#   …\AppData\Local\Temp\ns*.tmp\…           an NSIS installer unpacking
#
# The last six are the measurement of 2026-10-19, 17:03 to 17:16, from eight
# installations and uninstalls driven through winget while the driver was
# loaded: Notepad++, VLC, 7-Zip, Everything, Obsidian, Inno Setup, Discord and
# PowerToys. Every one produced a warning about a machine with nothing wrong
# with it. These are the harnesses Windows itself uses to install and remove
# software, so their volume says nothing about the process doing it.
#
# Beyond the table, the 17:26 to 18:16 measurement of the same day added three
# trees: the font cache rotating `FontCache-Obsolete-*.dat` under
# `…\ServiceProfiles\LocalService\AppData\Local\FontCache\`, the
# application-impact store under `…\Windows\AppCompat\AIDD\`, and WhatsApp's
# WebView2 profile (already covered by `\ebwebview\`).
#
# Program Files is deliberately absent from the tree list: an uninstaller
# deleting its own install directory is the one item in the measurement that no
# path can separate from something worth reporting. It is separated by actor
# instead, below. Steam is the exception because its updater deletes its own
# files on a schedule — measured at 15:57, 15:58 and 16:01 on 2026-10-19 — and
# a warning on every update is a warning nobody reads.
path_excludes = [
    "\\programdata\\microsoft\\windows defender\\scans\\history\\",
    "\\appdata\\local\\comms\\", "\\$extend\\",
    "\\windows\\appcompat\\programs\\", "\\windows\\prefetch\\",
    "\\windows\\system32\\sru\\",
    "\\windows\\system32\\config\\systemprofile\\appdata\\local\\",
    "\\d3dscache\\", "\\ebwebview\\", "\\code cache\\", "\\grshadercache\\",
    "\\cachestorage\\", "\\cryptneturlcache\\", "\\onedrive\\logs\\",
    "\\appdata\\roaming\\surfshark\\", "\\appdata\\roaming\\.minecraft\\",
    "\\appdata\\locallow\\sogoupy\\", "\\.cc-switch\\", "\\com.ccswitch.desktop\\",
    "\\cache2\\", "\\program files (x86)\\steam\\", "\\appdata\\local\\steam\\",
    "\\scoped_dir_steam",
    "\\program files\\windowsapps\\deleted\\", "\\windows\\apprepository\\",
    "\\config.msi\\", "\\appdata\\local\\programs\\",
    "\\appdata\\local\\powertoys\\", "\\appdata\\local\\temp\\ns",
    "\\fontcache\\", "\\windows\\appcompat\\aidd\\", "\\temp\\7zs",
]
# The actor, not the tree. An uninstaller removing the product it was installed
# to remove deletes that product's files in bulk, and the path cannot say so:
# `C:\Program Files\Zoom\…` is the same path whether the user is removing Zoom
# or something is sweeping it. Measured on the host on 2026-10-19 from 17:03 to
# 18:16 over twenty-two install and uninstall pairs driven through winget:
# Windows Installer's `msiexec.exe` (Audacity, Zoom, LibreOffice, Thunderbird),
# Inno Setup's `unins000.exe` and `_iu*.tmp`, NSIS's `Un_A.exe` and `Un_B.exe`,
# and Squirrel's `update.exe` (Slack, and Discord when it updates) each did
# exactly this, producing one warning per removal.
#
# A process named `unins000.exe` that deletes a user's documents is still
# reported: these entries refuse only this mass-file rule, and a document root
# is not an uninstaller's own tree.
process_image_excludes = [
    "msiexec.exe", "unins*.exe", "*uninstall*.exe", "un_a.exe", "un_b.exe",
    "un.exe", "_unins", "_iu", "update.exe",
]
count = 25
window_seconds = 30
dedupe_seconds = 600

[[rule]]
id = "BEH-0005"
name = "documents renamed in bulk"
description = "One process renamed fifteen documents or archives within a minute."
severity = "medium"
subject = "file"
action = ["file_renamed"]
path_suffix = [
    ".doc", ".docx", ".xls", ".xlsx", ".ppt", ".pptx", ".pdf", ".jpg", ".jpeg",
    ".png", ".txt", ".csv", ".zip", ".rar", ".7z",
]
# The extension list is not enough to say "documents": a program's own `.png`
# artwork and `.txt` licence carry the same suffixes, and installing and
# removing software renames them in bulk. So the rule asks a second question —
# *whose* documents — and only a user's document roots answer it: the profile's
# Documents, Desktop, Pictures, Videos, Music and Downloads, and a synced
# library (OneDrive, Dropbox, Google Drive, iCloud Drive) wherever it is
# mounted. A custom folder (`D:\Files\`) is not on the list deliberately: the
# rule is about the place Windows calls a person's documents, and a sweep
# anywhere else still reaches BEH-0003's twenty-file threshold.
#
# Measured on 2026-10-19 at 15:56 and 15:58 (a Steam update renaming fifteen
# controller images) and at 17:03 and 17:16 (a winget source update renaming
# licence files as packages were installed). The same fifteen in Pictures
# still fire.
path_contains = [
    "\\documents\\", "\\desktop\\", "\\pictures\\", "\\videos\\", "\\music\\",
    "\\downloads\\", "\\onedrive", "\\dropbox\\", "\\google drive\\",
    "\\icloud drive\\",
]
count = 15
window_seconds = 60
dedupe_seconds = 300

[[rule]]
id = "BEH-0006"
name = "documents deleted in bulk"
description = "One process requested the deletion of fifteen documents or archives within a minute."
severity = "medium"
subject = "file"
action = ["file_deleted"]
path_suffix = [
    ".doc", ".docx", ".xls", ".xlsx", ".ppt", ".pptx", ".pdf", ".jpg", ".jpeg",
    ".png", ".txt", ".csv", ".zip", ".rar", ".7z",
]
# The same document-root question as BEH-0005, for the same measured reason.
# Measured on 2026-10-19 at 17:03 and 17:16: a winget source update and a
# PowerToys uninstall removed package artwork (`…\Assets\…\*.png`) under
# `C:\Program Files\WindowsApps\Deleted\…`, and a GIMP and Joplin uninstall
# deleted their own `.txt` and `.png` files. None of those is a person's
# document; the same fifteen in Pictures still fire.
path_contains = [
    "\\documents\\", "\\desktop\\", "\\pictures\\", "\\videos\\", "\\music\\",
    "\\downloads\\", "\\onedrive", "\\dropbox\\", "\\google drive\\",
    "\\icloud drive\\",
]
count = 15
window_seconds = 60
dedupe_seconds = 300

[[rule]]
id = "BEH-0007"
name = "startup folder write"
description = "An executable was placed in a Startup folder, which is how a program survives a reboot."
severity = "medium"
subject = "file"
action = ["file_renamed"]
path_contains = ["\\start menu\\programs\\startup\\"]
path_suffix = [
    ".lnk", ".exe", ".dll", ".bat", ".cmd", ".vbs", ".vbe", ".js", ".jse",
    ".wsf", ".hta", ".ps1", ".scr",
]

# At low severity: an installer updating a DLL under System32 does this
# legitimately, and a warning is all this evidence is worth.
[[rule]]
id = "BEH-0008"
name = "system file renamed"
description = "A file under System32 was renamed or moved."
severity = "low"
subject = "file"
action = ["file_renamed"]
path_contains = ["\\windows\\system32\\"]
path_suffix = [".exe", ".dll", ".sys"]

# ---------------------------------------------------------------------------
# Registry: persistence
# ---------------------------------------------------------------------------

# Every rule in this file was written from what an event *names* until
# 2026-10-19, when the driver began sending a registry value's data as well.
# The persistence rules below are the ones that could finally tell two writes
# apart, and each is narrowed to what the data has to say: an autostart entry in
# a directory an unprivileged user can write to is the signal, and
# `C:\Program Files\…`, which is what every ordinary installer writes, is not.
#
# The narrowing is a *measurement gap made into a rule*: until this build the
# driver never carried a value, so the host rounds could not say which values
# are ordinary — only that the rules fired on every install. The VM run from
# 2026-10-19 onwards is the measurement for these, and any value a rule here
# still reports on a healthy machine belongs in a `value_excludes` entry rather
# than in a wider threshold.

[[rule]]
id = "BEH-0010"
name = "Run key value in a writable location"
description = "A program was listed to start at sign-in from a directory an unprivileged user can write to."
severity = "medium"
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
path_contains = [
    "\\currentversion\\run\\", "\\currentversion\\runonce\\",
    "\\currentversion\\runservices\\", "\\currentversion\\runservicesonce\\",
]
# The directories a standard user can write to. A program that has to survive a
# reboot and is installed properly lives in `Program Files`; one that lives here
# was put here by someone who could not write there, which is the shape of
# persistence rather than of an installer. Matched against the value's data, not
# the key: the key is the same for both.
value_contains = [
    "\\appdata\\", "%appdata%", "%localappdata%",
    "%temp%", "%tmp%", "\\temp\\",
    "%userprofile%", "\\users\\public\\",
    "\\programdata\\", "\\downloads\\", "\\desktop\\", "\\documents\\",
]

# The other half of the same question: the data is a command rather than a
# path. An installer writes its own executable; a loader writes whatever it was
# told to, and the interpreter is the one part of that command the attacker
# cannot hide.
[[rule]]
id = "BEH-0037"
name = "Run key value launches an interpreter"
description = "A Run key was written whose data starts a script host or a command interpreter."
severity = "high"
score = 80
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
path_contains = [
    "\\currentversion\\run\\", "\\currentversion\\runonce\\",
    "\\currentversion\\runservices\\", "\\currentversion\\runservicesonce\\",
]
value_contains = [
    "powershell", "pwsh", "mshta", "wscript", "cscript",
    "rundll32", "regsvr32",
    "cmd.exe /c", "cmd.exe /k", "cmd /c", "cmd /k",
    "-encodedcommand", "-enc ",
]

[[rule]]
id = "BEH-0011"
name = "Run key created"
description = "A key was created under a Run key."
severity = "low"
subject = "registry"
action = ["registry_changed"]
detail = ["registry_key_created"]
path_contains = [
    "\\currentversion\\run\\", "\\currentversion\\runonce\\",
    "\\currentversion\\runservices\\", "\\currentversion\\runservicesonce\\",
]

[[rule]]
id = "BEH-0012"
name = "Winlogon value"
description = "A Winlogon value was written, which is a way to start a program at sign-in that no Run key lists."
severity = "high"
score = 90
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
path_contains = [
    "\\winlogon\\shell", "\\winlogon\\userinit", "\\winlogon\\taskman",
    "\\winlogon\\appsetup", "\\winlogon\\vmapplet",
]

[[rule]]
id = "BEH-0013"
name = "IFEO debugger"
description = "A debugger was attached to a program through Image File Execution Options."
severity = "medium"
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
path_contains = ["\\image file execution options\\"]
# The rule names one value, and now tests for it. Every key under Image File
# Execution Options was the whole condition before, and a healthy machine fills
# that tree with values that have nothing to do with hijacking a program:
# measured on the host on 2026-10-19 at 14:41:32, Defender's own maintenance
# wrote `…\DefenderAgentScan.exe\MitigationOptions` — the exploit-protection
# setting — and earlier Notepad3 set `…\notepad.exe\UseFilter` to install
# itself as notepad. Both warned. `Debugger` is what the rule is named for and
# what a copy of a system binary is pointed at, so the value name is the
# condition; the other values in the tree are another rule's business, not
# this one's.
path_suffix = ["\\debugger"]

[[rule]]
id = "BEH-0014"
name = "Silent process exit"
description = "A SilentProcessExit value was written, which starts a monitor when a named process exits."
severity = "medium"
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
path_contains = ["\\silentprocessexit\\"]

[[rule]]
id = "BEH-0015"
name = "service image path in a writable location"
description = "A service was pointed at an executable in a directory an unprivileged user can write to."
severity = "medium"
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
path_contains = ["\\services\\"]
path_suffix = ["\\imagepath"]
# The same list as BEH-0010, for the same reason and with the same measurement
# status. A service runs as SYSTEM when it starts, so an `ImagePath` in a
# user-writable directory is how an unprivileged write becomes SYSTEM code at
# the next boot. Services installed the ordinary way live in `System32` or
# `Program Files`.
value_contains = [
    "\\appdata\\", "%appdata%", "%localappdata%",
    "%temp%", "%tmp%", "\\temp\\",
    "%userprofile%", "\\users\\public\\",
    "\\programdata\\", "\\downloads\\", "\\desktop\\", "\\documents\\",
]

# And the same second half: `ImagePath` naming a shell instead of a program is
# how a service is used to run an arbitrary command line at boot.
[[rule]]
id = "BEH-0038"
name = "service image path is a command line"
description = "A service's image path starts a command interpreter."
severity = "high"
score = 80
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
path_contains = ["\\services\\"]
path_suffix = ["\\imagepath"]
value_contains = [
    "cmd.exe /c", "cmd.exe /k", "cmd /c", "cmd /k",
    "powershell", "pwsh", "wscript", "cscript", "mshta",
    "rundll32", "regsvr32",
]

[[rule]]
id = "BEH-0016"
name = "AppInit_DLLs"
description = "AppInit_DLLs was written, which loads a DLL into most processes on the machine."
severity = "high"
score = 90
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
path_contains = ["\\currentversion\\windows\\appinit_dlls"]

[[rule]]
id = "BEH-0017"
name = "shell open command in a writable location"
description = "A file association was pointed at an executable in a directory an unprivileged user can write to."
severity = "medium"
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
path_suffix = ["\\shell\\open\\command"]
# The command line a file type runs when it is double-clicked. Every program
# that registers a file type writes one, and the ones that install properly
# write a path in `Program Files`; the value is what separates an installer
# from a hijack.
value_contains = [
    "\\appdata\\", "%appdata%", "%localappdata%",
    "%temp%", "%tmp%", "\\temp\\",
    "%userprofile%", "\\users\\public\\",
    "\\programdata\\", "\\downloads\\", "\\desktop\\", "\\documents\\",
]
# Measured on the VM on 2026-10-20 19:37:20: OneDrive registered its own
# `odopen` URL handler, whose command is
# `"C:\Users\<user>\AppData\Local\Microsoft\OneDrive\OneDrive.exe" /url:"%1"`.
# A per-user application that installs itself under `AppData` and owns the
# protocol it registers is what an installer does; the location alone cannot
# tell it from a hijack. The exclusion names the binary, not the directory:
# `AppData\Local\Microsoft\OneDrive\` is user-writable like everything else
# under `AppData`, so excluding the directory would hide a dropper placed
# there. A different executable in that directory still fires.
value_excludes = ["\\microsoft\\onedrive\\onedrive.exe"]

[[rule]]
id = "BEH-0039"
name = "shell open command runs an interpreter"
description = "A file association's open command starts a command interpreter."
severity = "high"
score = 80
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
path_suffix = ["\\shell\\open\\command"]
value_contains = [
    "cmd.exe /c", "cmd.exe /k", "cmd /c", "cmd /k",
    "powershell", "pwsh", "wscript", "cscript", "mshta",
    "rundll32", "regsvr32",
]

[[rule]]
id = "BEH-0018"
name = "credential caching enabled"
description = "WDigest's UseLogonCredential was written, which can make Windows keep readable passwords in memory."
severity = "high"
score = 90
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
path_contains = ["\\wdigest\\uselogoncredential"]

[[rule]]
id = "BEH-0019"
name = "user shell folders"
description = "A user shell folder was redirected, which is how a folder path is hijacked."
severity = "low"
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
path_contains = [
    "\\currentversion\\explorer\\user shell folders",
    "\\currentversion\\explorer\\shell folders",
]

[[rule]]
id = "BEH-0020"
name = "App Paths value in a writable location"
description = "An App Paths entry was pointed at an executable in a directory an unprivileged user can write to."
severity = "medium"
subject = "registry"
action = ["registry_changed"]
detail = ["registry_value_set"]
path_contains = ["\\currentversion\\app paths\\"]
# App Paths is what makes `winword` resolve to a program without a full path,
# and every application that supports "Run" from the Start menu writes one. The
# value is normally the program's own directory or its executable under
# `Program Files`; an entry in a user-writable directory redirects a name that
# other programs trust.
value_contains = [
    "\\appdata\\", "%appdata%", "%localappdata%",
    "%temp%", "%tmp%", "\\temp\\",
    "%userprofile%", "\\users\\public\\",
    "\\programdata\\", "\\downloads\\", "\\desktop\\", "\\documents\\",
]

