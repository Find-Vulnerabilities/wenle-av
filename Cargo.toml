[workspace]
resolver = "2"
members = ["crates/av-core", "crates/av-rules"]

# The kernel driver lives in its own workspace (see crates/av-driver) because it
# requires the WDK, a nightly toolchain and `-Z build-std`. Keeping it out of the
# default member set means `cargo build` never tries to compile it.
default-members = ["crates/av-core", "crates/av-rules"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Wenle Antivirus Contributors"]
repository = "https://github.com/wenle/wenle-av"

[workspace.dependencies]
# --- error handling -----------------------------------------------------------
thiserror = "2"
anyhow = "1"

# --- serialization ------------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bincode = "1.3"

# --- hashing / checksums ------------------------------------------------------
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"

# --- pattern matching ---------------------------------------------------------
aho-corasick = "1.1"
regex = "1"

# --- binary parsing -----------------------------------------------------------
pelite = "0.10"

# --- concurrency --------------------------------------------------------------
rayon = "1"
dashmap = "6"
parking_lot = "0.12"
crossbeam-channel = "0.5"
once_cell = "1"
lru = "0.12"

# --- I/O ----------------------------------------------------------------------
memmap2 = "0.9"
walkdir = "2"
tempfile = "3"
dirs = "6"

# --- logging ------------------------------------------------------------------
log = "0.4"
env_logger = "0.11"

# --- misc utilities -----------------------------------------------------------
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rand = "0.9"
bitflags = "2"
smallvec = "1"
num_cpus = "1"
byteorder = "1"

# --- internal crates ----------------------------------------------------------
av-core = { path = "crates/av-core" }
av-rules = { path = "crates/av-rules" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Scanning is extremely hot; make debug builds of the scanner usable too.
[profile.dev.package."*"]
opt-level = 2

# Shared lint policy. Every crate opts in with `[lints] workspace = true`.
#
# `missing_docs` is a warning rather than an error on purpose: it keeps the
# public API documented without turning a missing sentence into a build break.
# The correctness lints below *are* errors, because each one has bitten this
# codebase's predecessor in a way that shipped a wrong verdict.
[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
# A scanner that panics on a malformed file is a denial of service. Both of
# these are warnings, not errors, and each crate relaxes them under `cfg(test)`
# where unwrapping is the correct way to write an assertion.
unwrap_used = "warn"
expect_used = "warn"
# Catch `len() == 0`, `x == false`, and similar.
bool_comparison = "warn"
# Iterating a map in hash order makes scan output non-deterministic.
iter_over_hash_type = "warn"
#
# Deliberately *not* enabled:
#
# * `arithmetic_side_effects` — a restriction lint that flags every `i += 1` in
#   a loop counter or a lexer's line tally. Overflow there is impossible in
#   practice and the lint drowns out real findings. The places where wrapping
#   would be a security bug (verdict scores, byte offsets into an untrusted
#   buffer) use saturating or checked arithmetic explicitly, which documents the
#   intent far better than a blanket lint.
# * `panic` — fires on every `assert!` and `panic!` in test and test-helper
#   code. A panic in a test *is* the desired behaviour, so the lint can only be
#   made useful by relaxing it everywhere it would fire.

